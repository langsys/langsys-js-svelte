name: Publish to npm

on:
    release:
        types: [published]

jobs:
    publish:
        runs-on: ubuntu-latest
        environment: npm-publish
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v5
              with:
                  node-version: 22
                  registry-url: https://registry.npmjs.org
                  cache: npm

            # OIDC trusted publishing (tokenless) requires npm >= 11.5.1; Node 22 ships npm 10.x.
            # ci.yml installs the same major, so a pull request's CI runs the npm that publishes.
            - run: npm install -g npm@12

            - run: npm ci

            - run: npm run check

            - run: npm test -- --run

            - run: npm run package

            # The agent skill in skill/ ships in this tarball: every name it uses must exist in this build.
            - run: node _dev_/skill-gate.mjs

            - run: npm publish --provenance
