name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: npm

            # The npm publish.yml publishes with, so a change in its behaviour shows here before a tag.
            - run: npm install -g npm@12

            - run: npm ci

            # Runs BEFORE check/test on purpose: this gate spent an unknown
            # stretch refusing to run at all -- prettier-plugin-svelte could not
            # parse Svelte 5's AST, and ESLint 10 ignored the legacy .eslintrc --
            # and nothing noticed, because CI never invoked it. A lint script no
            # workflow calls will rot again the same way.
            - run: npm run lint

            - run: npm run check

            - run: npm test -- --run

    changelog-coverage:
        runs-on: ubuntu-latest
        steps:
            # fetch-depth: 0 is REQUIRED, not tidiness. actions/checkout does a shallow
            # clone with no tags by default, and the script exits 0 with "no release
            # tags yet" when it finds none — so without this the check passes
            # vacuously and enforces nothing. Verified against a --no-tags clone.
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0

            - uses: actions/setup-node@v5
              with:
                  node-version: 22

            - run: node _dev_/changelog-coverage.mjs . --strict

    docs-api-coverage:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: npm

            # The npm publish.yml publishes with: the skill check below reads its `npm pack` output.
            - run: npm install -g npm@12

            - run: npm ci

            # The check reads dist/index.d.ts — the surface a consumer's typechecker
            # actually resolves — so the package must be built first. Without this the
            # script exits 1 with "run npm run package"; it does not pass vacuously.
            - run: npm run package

            - run: node _dev_/docs-api-coverage.mjs . --strict

            # The agent skill ships in the tarball: every name, option, prop and path it uses must
            # exist in this build, the core or the pack, and each Svelte example must compile cleanly.
            - run: node _dev_/skill-gate.mjs
